<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>15th Monthsary — October 15, 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            obsidian: '#060608',
            surface: '#0e0e12',
            neonPink: '#f472b6',
            neonPurple: '#a855f7',
            neonGreen: '#34d399',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen antialiased selection:bg-purple-500/30 selection:text-pink-200 grid-backdrop relative">

  <!-- Background Audio Asset -->
  <audio id="bg-audio" src="assets/audio/Love%20Is.mp3" loop preload="auto"></audio>

  <!-- Global 3-Tile Full-Screen Background Slideshow (Login & Letter BG) -->
  <div id="login-slideshow" class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="grid grid-cols-3 w-full h-full gap-1.5 bg-[#060608]">
      <div class="relative w-full h-full overflow-hidden">
        <img id="tile-0-a" class="slide-tile active" alt="" />
        <img id="tile-0-b" class="slide-tile" alt="" />
      </div>
      <div class="relative w-full h-full overflow-hidden">
        <img id="tile-1-a" class="slide-tile active" alt="" />
        <img id="tile-1-b" class="slide-tile" alt="" />
      </div>
      <div class="relative w-full h-full overflow-hidden">
        <img id="tile-2-a" class="slide-tile active" alt="" />
        <img id="tile-2-b" class="slide-tile" alt="" />
      </div>
    </div>
    <div class="absolute inset-0 bg-black/55"></div>
  </div>

  <!-- 1. SECURE LOCK SCREEN (MONTHSARY VAULT) -->
  <section id="vault-overlay" class="vault-transition fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="w-full max-w-sm border-gradient rounded-3xl p-7 sm:p-9 shadow-2xl relative overflow-hidden bg-[#101014]/90 backdrop-blur-xl">
      <div class="text-center mb-6 relative z-10">
        <div class="w-12 h-12 mx-auto mb-4 rounded-2xl bg-white/[0.06] border border-white/10 flex items-center justify-center relative">
          <svg id="lock-svg" class="w-5 h-5 text-white relative z-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="font-display text-2xl font-bold tracking-tight text-white">
          15th Monthsary <span class="text-gradient">Vault</span>
        </h1>
      </div>

      <div id="pin-display" class="flex justify-center items-center gap-3 my-5 py-3.5 px-4 rounded-2xl bg-white/[0.03] border border-white/10 relative z-10">
        <div class="pin-dot w-3 h-3 rounded-full border border-zinc-400 transition-all duration-200"></div>
        <div class="pin-dot w-3 h-3 rounded-full border border-zinc-400 transition-all duration-200"></div>
        <div class="pin-dot w-3 h-3 rounded-full border border-zinc-400 transition-all duration-200"></div>
        <div class="pin-dot w-3 h-3 rounded-full border border-zinc-400 transition-all duration-200"></div>
        <div class="pin-dot w-3 h-3 rounded-full border border-zinc-400 transition-all duration-200"></div>
        <div class="pin-dot w-3 h-3 rounded-full border border-zinc-400 transition-all duration-200"></div>
      </div>

      <p id="vault-status" class="text-center font-mono text-[11px] tracking-widest h-4 mb-4 text-zinc-400 transition-colors relative z-10">
        ENTER PASSCODE
      </p>

      <div class="grid grid-cols-3 gap-2.5 font-display text-lg font-medium relative z-10">
        <button type="button" data-key="1" class="pin-key h-12 rounded-xl bg-white/[0.05] border border-white/10 text-white">1</button>
        <button type="button" data-key="2" class="pin-key h-12 rounded-xl bg-white/[0.05] border border-white/10 text-white">2</button>
        <button type="button" data-key="3" class="pin-key h-12 rounded-xl bg-white/[0.05] border border-white/10 text-white">3</button>
        <button type="button" data-key="4" class="pin-key h-12 rounded-xl bg-white/[0.05] border border-white/10 text-white">4</button>
        <button type="button" data-key="5" class="pin-key h-12 rounded-xl bg-white/[0.05] border border-white/10 text-white">5</button>
        <button type="button" data-key="6" class="pin-key h-12 rounded-xl bg-white/[0.05] border border-white/10 text-white">6</button>
        <button type="button" data-key="7" class="pin-key h-12 rounded-xl bg-white/[0.05] border border-white/10 text-white">7</button>
        <button type="button" data-key="8" class="pin-key h-12 rounded-xl bg-white/[0.05] border border-white/10 text-white">8</button>
        <button type="button" data-key="9" class="pin-key h-12 rounded-xl bg-white/[0.05] border border-white/10 text-white">9</button>
        <button type="button" id="pin-clear" class="pin-key h-12 rounded-xl bg-white/[0.03] border border-white/10 text-xs font-mono uppercase tracking-wider text-zinc-300 hover:text-white">CLR</button>
        <button type="button" data-key="0" class="pin-key h-12 rounded-xl bg-white/[0.05] border border-white/10 text-white">0</button>
        <button type="button" id="pin-back" aria-label="Backspace" class="pin-key h-12 rounded-xl bg-white/[0.03] border border-white/10 flex items-center justify-center text-zinc-300 hover:text-white">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
      </div>

      <!-- Bypass Enter Button -->
      <button
        type="button"
        id="bypass-enter-btn"
        class="mt-4 w-full h-11 rounded-xl bg-white/[0.07] hover:bg-white/[0.12] border border-white/15 text-xs font-mono uppercase tracking-widest text-white transition flex items-center justify-center gap-2 relative z-10"
      >
        <span>Enter</span>
        <svg class="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </section>

  <!-- 2. UNLOCKED LETTER & MUSIC PLAYER ONLY -->
  <div id="main-experience" class="main-reveal relative z-10 min-h-screen flex flex-col justify-center py-10 px-4 sm:px-6">
    <main class="w-full max-w-3xl mx-auto space-y-6">

      <!-- Compact Top Bar: Slim Music Player + Lock Letter Button -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <!-- Compact Single-Row Music Player -->
        <div id="music-player" class="border-gradient rounded-2xl px-3.5 py-2 bg-[#0e0e15]/95 backdrop-blur-2xl shadow-lg flex flex-wrap items-center gap-3">
          <!-- Track Name & Equalizer -->
          <div class="flex items-center gap-2 pr-1">
            <div id="eq-bars" class="flex items-end gap-0.5 h-3">
              <span class="eq-bar w-0.5 h-1.5 bg-pink-400 rounded-full"></span>
              <span class="eq-bar w-0.5 h-3 bg-purple-400 rounded-full"></span>
              <span class="eq-bar w-0.5 h-2 bg-emerald-400 rounded-full"></span>
            </div>
            <span class="font-display text-xs font-semibold text-white whitespace-nowrap">Love Is</span>
          </div>

          <!-- Transport Controls -->
          <div class="flex items-center gap-1">
            <button
              id="player-rw-btn"
              type="button"
              title="Rewind 10s"
              aria-label="Rewind 10 seconds"
              class="w-7 h-7 rounded-lg bg-white/[0.04] hover:bg-white/[0.1] border border-white/10 flex items-center justify-center text-zinc-300 hover:text-white transition"
            >
              <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 19 2 12 11 5 11 19"></polygon>
                <polygon points="22 19 13 12 22 5 22 19"></polygon>
              </svg>
            </button>

            <button
              id="player-play-btn"
              type="button"
              title="Play / Pause"
              aria-label="Play or Pause Music"
              class="w-7 h-7 rounded-lg bg-gradient-to-tr from-pink-500/25 via-purple-500/25 to-emerald-400/25 border border-white/20 flex items-center justify-center text-white hover:border-pink-400/60 transition"
            >
              <svg id="icon-play" class="w-3 h-3 ml-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <svg id="icon-pause" class="w-3 h-3 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
            </button>

            <button
              id="player-ff-btn"
              type="button"
              title="Fast Forward 10s"
              aria-label="Fast Forward 10 seconds"
              class="w-7 h-7 rounded-lg bg-white/[0.04] hover:bg-white/[0.1] border border-white/10 flex items-center justify-center text-zinc-300 hover:text-white transition"
            >
              <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="13 19 22 12 13 5 13 19"></polygon>
                <polygon points="2 19 11 12 2 5 2 19"></polygon>
              </svg>
            </button>
          </div>

          <!-- Seek Slider + Time -->
          <div class="flex items-center gap-2">
            <input
              id="player-seek"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Seek timeline"
              class="player-range w-24 sm:w-32 h-1 bg-white/15 rounded-lg appearance-none cursor-pointer"
            />
            <span class="text-[10px] font-mono text-zinc-400 tabular-nums whitespace-nowrap">
              <span id="player-current">0:00</span> / <span id="player-duration">0:00</span>
            </span>
          </div>

          <!-- Volume Control -->
          <div class="flex items-center gap-1.5 pl-1 border-l border-white/10">
            <button
              id="player-mute-btn"
              type="button"
              title="Mute / Unmute"
              aria-label="Toggle Mute"
              class="w-6 h-6 rounded-md hover:bg-white/[0.08] flex items-center justify-center text-zinc-300 transition shrink-0"
            >
              <svg id="icon-vol-on" class="w-3.5 h-3.5 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
              <svg id="icon-vol-off" class="w-3.5 h-3.5 text-pink-400 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
            </button>

            <input
              id="player-volume"
              type="range"
              min="0"
              max="1"
              step="0.01"
              value="0.8"
              aria-label="Volume"
              class="player-range w-14 h-1 bg-white/15 rounded-lg appearance-none cursor-pointer"
            />
          </div>
        </div>

        <!-- Compact Lock Letter Button -->
        <button
          id="relock-btn"
          type="button"
          class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white/[0.04] hover:bg-white/[0.1] border border-white/15 text-[11px] font-mono uppercase tracking-wider text-zinc-200 hover:text-white transition"
        >
          <svg class="w-3.5 h-3.5 text-pink-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Lock Letter
        </button>
      </div>

      <!-- Heartfelt Letter Card -->
      <article id="letter" class="border-gradient rounded-3xl p-7 sm:p-12 relative overflow-hidden bg-[#0e0e15]/90 backdrop-blur-2xl shadow-2xl">
        <div class="flex items-center justify-between text-xs font-mono text-zinc-400 pb-6 mb-8 border-b border-white/10">
          <span>15TH MONTHSARY LETTER</span>
          <span>OCTOBER 15, 2026</span>
        </div>

        <div id="letter-body" class="space-y-5 text-zinc-200 leading-relaxed text-base sm:text-lg font-light">
          <p class="pt-2 font-display text-white font-semibold">
            Forever and only yours,<br />
            <span class="text-gradient">CJay</span>
          </p>
        </div>
      </article>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
